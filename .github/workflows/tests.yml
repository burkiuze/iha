# Yalnızca yazılım doğrulaması: kurulum + testler + örnek/CLI duman testi.
# Dağıtım, donanım erişimi, dış servis ya da gizli bilgi (secret) kullanılmaz.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false            # bir sürümdeki hata diğerlerini gizlemesin
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Paketi kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Testler
        run: python -m unittest discover -s tests -v
      - name: Örnek ve CLI duman testi
        run: |
          python examples/senaryo_demo.py
          python examples/fault_injection_demo.py
          python -m simurg.sim list
          simurg-sim run transition_abort --seed 1
